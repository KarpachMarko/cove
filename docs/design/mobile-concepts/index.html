function icon(name,fallback='•'){return `<i class="zs-icon" data-lucide="${name}" aria-hidden="true">${ICONS[name]||fallback}</i>`}
function ib(name,label,action,extra=''){return `<button class="zs-iconbtn ${extra}" aria-label="${label}" data-action="${action}">${icon(name,{'play':'▶','pause':'Ⅱ','ellipsis':'•••','list-music':'☷','skip-forward':'⏭','chevron-left':'‹','search':'⌕','shuffle':'⤨','grip-horizontal':'≡','plus':'+','arrow-up':'↑','arrow-down':'↓'}[name]||'•')}</button>`}
function cover(a){return `<span class="zs-art"><img src="${ART[a.art]}" alt="${a.title} fictional album artwork"><span class="zs-artword">${a.title}</span></span>`}
function albumGrid(n=4){return `<div class="zs-covers">${albums.slice(0,n).map((a,i)=>`<button class="zs-album" data-action="album" data-index="${i}">${cover(a)}<span class="zs-albumname">${a.title}</span><span class="zs-artist">${a.artist}</span></button>`).join('')}</div>`}
function heading(t,action='',a=''){return `<div class="zs-sectionhead"><h3>${t}</h3>${action?`<button data-action="${a}">${action}</button>`:''}</div>`}
function actions(){return `<div class="zs-actions"><button data-action="play-all">${icon('play','▶')} Play</button><button data-action="shuffle">${icon('shuffle','⤨')} Shuffle</button></div>`}
function row(t,i,mode='normal'){return `<div class="zs-row" data-track="${i}" ${mode==='order'?'draggable="true"':''}>${mode==='number'?`<span class="zs-num">${i+1}</span>`:`<img src="${ART[t.art]}" alt="">`}<button class="zs-rowmain" data-action="track" data-index="${i}"><strong>${t.title}</strong><small>${t.artist}</small></button>${mode==='order'?`<div class="zs-reorder"><button data-action="move-up" data-index="${i}" aria-label="Move ${t.title} up">↑</button><button data-action="move-down" data-index="${i}" aria-label="Move ${t.title} down">↓</button></div>${icon('grip-horizontal','≡')}`:ib('ellipsis',`Actions for ${t.title}`,'track-menu') }</div>`}
function categoryRows(){return `<div class="zs-categories">${[['list-music','Playlists','playlists'],['mic-2','Artists','artists'],['disc-3','Albums','albums'],['music-2','Songs','songs']].map(([ic,l,a])=>`<button class="zs-category" data-action="${a}">${icon(ic,'♪')}${l}<span class="zs-chevron">›</span></button>`).join('')}</div>`}
function chips(selected){return `<div class="zs-chips">${['Albums','Artists','Songs','Playlists'].map(t=>`<button class="${selected===t?'active':''}" data-action="${t.toLowerCase()}">${t}</button>`).join('')}</div>`}
function feature(){return `<button class="zs-feature" style="display:block;width:100%;padding:0;text-align:left" data-action="playlist"><img src="${ART.night}" alt="Mountain lake at dusk"><span class="zs-featurecopy"><strong>Evening drive</strong><small>24 songs · Your playlist</small></span></button>`}
function library(v){if(v.layout==='classic')return `<div class="zs-top"><span class="zs-brand">ZenSync</span>${ib('circle-user-round','Settings','settings','zs-accent')}</div><h1 class="zs-title">Library</h1>${categoryRows()}${heading('Recently added','See all','albums')}${albumGrid(4)}`;
if(v.layout==='artwork')return `<div class="zs-top"><span class="zs-brand">ZenSync</span>${ib('arrow-down-wide-narrow','Change album sort','sort','zs-accent')}</div><h1 class="zs-title">Library</h1>${chips('Albums')}<div class="zs-sort"><span>126 albums</span><button data-action="sort">Recently added ⌄</button></div><div style="height:14px"></div>${albumGrid(4)}`;
if(v.layout==='compact')return songs(v,true);
if(v.layout==='collections')return `<div class="zs-top"><span class="zs-brand">ZenSync</span>${ib('plus','Create playlist','create','zs-accent')}</div><h1 class="zs-title">Library</h1>${chips('Playlists')}${feature()}${heading('Your playlists','See all','playlists')}${[{title:'Evening drive',artist:'24 songs',art:'night'},{title:'Slow mornings',artist:'18 songs',art:'blue'},{title:'On repeat',artist:'32 songs',art:'motion'}].map((t,i)=>row(t,i)).join('')}`;
return `<div class="zs-darkhero"><div class="zs-top"><span class="zs-brand">ZenSync</span>${ib('circle-user-round','Settings','settings')}</div><h1 class="zs-title">Library</h1>${feature()}</div>${heading('Your albums','See all','albums')}${albumGrid(2)}${heading('Artists','See all','artists')}<div class="zs-artistrow">${albums.slice(0,3).map(a=>`<button class="zs-artisttile" data-action="artist"><img src="${ART[a.art]}" alt="">${a.artist}</button>`).join('')}</div>`}
function songs(v,isHome=false){return `<div class="zs-top"><span class="zs-brand">${isHome?'ZenSync':'Library'}</span>${ib('arrow-down-wide-narrow','Sort songs','sort','zs-accent')}</div><h1 class="zs-title">${isHome?'Library':'Songs'}</h1>${isHome?`<div class="zs-subtitle">2,418 songs in your collection</div>${chips('Songs')}`:''}${actions()}<div class="zs-sort"><span>All songs</span><button data-action="sort">Title ⌄</button></div>${tracks.map((t,i)=>row(t,i)).join('')}`}
function search(){return `<div class="zs-top"><span class="zs-brand">ZenSync</span></div><h1 class="zs-title">Search</h1><button class="zs-search" data-action="search-cycle">${icon('search','⌕')} <span>Mira Sol</span>${icon('x','×')}</button><div class="zs-segment"><button class="active" data-action="search-filter" data-filter="all">All</button><button data-action="search-filter" data-filter="library">Your library</button><button data-action="search-filter" data-filter="providers">Providers</button></div><div data-search-group="library">${heading('Your library')}<div class="zs-row"><img src="${ART.tides}" alt=""><button class="zs-rowmain" data-action="artist"><strong>Mira Sol</strong><small>Artist · 2 albums</small></button><span class="zs-chevron">›</span></div>${row(tracks[0],0)}${row(tracks[1],1)}</div><div data-search-group="providers">${heading('ZenSync providers')}<p class="zs-note" style="margin-top:-3px">Matches beyond your library</p>${[{title:'Low Tide',artist:'Mira Sol · Single',art:'tides'},{title:'Coastlines',artist:'Mira Sol · Album',art:'night'}].map(t=>`<div class="zs-row"><img src="${ART[t.art]}" alt=""><div class="zs-rowmain"><strong>${t.title}</strong><small>${t.artist}</small><span class="zs-tag">Available from provider</span></div>${ib('plus',`Add ${t.title} to library`,'provider-add','zs-accent')}</div>`).join('')}</div>`}
function album(phone){let a=albums[phone.album||0];return `<div class="zs-top"><button class="zs-accent" data-action="library">‹ Albums</button>${ib('ellipsis','Album actions','album-menu')}</div><div class="zs-coverhero">${cover(a)}</div><h1 class="zs-detailtitle">${a.title}</h1><p class="zs-detailartist">${a.artist}</p><p class="zs-detailmeta">2025 · 10 songs · 42 minutes</p>${actions()}${row({...tracks[0],artist:a.artist},0,'number')}<div class="zs-swiped"><span class="zs-num" style="align-self:center">2</span><button class="zs-rowmain" data-action="track" data-index="1"><strong>Open Water</strong><small>Swipe left for queue actions</small></button><button class="zs-swipeaction" data-action="next">${icon('list-start','≡')}Play next</button><button class="zs-swipeaction" data-action="last">${icon('list-end','≡')}Play last</button></div>${row(tracks[2],2,'number')}${row(tracks[3],3,'number')}`}
function queue(p){return `<div class="zs-top"><button class="zs-accent" data-action="player">‹ Now playing</button><button class="zs-accent" data-action="clear-queue">Clear</button></div><h1 class="zs-title">Queue</h1><div class="zs-queuehead">Now playing</div>${row(tracks[p.current||0],p.current||0)}<div class="zs-queuetools">${heading('Up next')}${ib('shuffle','Shuffle upcoming songs','shuffle-queue','zs-accent')}</div><p class="zs-note" style="margin-top:0">${p.queue.length} songs · Move into your preferred order</p><div class="zs-orderlist">${p.queue.map((t,i)=>row(t,i,'order')).join('')}</div><p class="zs-note">Only songs you add. Playback ends with your queue.</p>`}
function playlist(p){return `<div class="zs-top"><button class="zs-accent" data-action="library">‹ Playlists</button><button class="zs-accent" data-action="toggle-edit">${p.edit?'Done':'Edit'}</button></div><div class="zs-coverhero" style="width:139px">${cover({title:'Evening drive',art:'night'})}</div><h1 class="zs-detailtitle">Evening drive</h1><p class="zs-detailartist" style="font-size:12px">Your playlist</p><p class="zs-detailmeta">${p.playlist.length} songs · 25 minutes</p>${actions()}${p.edit?'<p class="zs-note">Move tracks to change the playlist order.</p>':''}<div class="zs-orderlist">${p.playlist.map((t,i)=>row(t,i,p.edit?'order':'normal')).join('')}</div>`}
function player(p){let t=tracks[p.current||0];return `<div class="zs-top"><button class="zs-accent" data-action="library">${icon('chevron-down','⌄')}</button><span class="zs-brand">Playing from your library</span>${ib('ellipsis','Track actions','track-menu')}</div><div class="zs-playerart">${cover({title:'Tides',art:t.art})}</div><h1 class="zs-playingtitle">${t.title}</h1><p class="zs-playingartist">${t.artist}</p><div class="zs-track"><span></span></div><div class="zs-times"><span>1:32</span><span>−2:40</span></div><div class="zs-transport">${ib('shuffle','Toggle shuffle','shuffle-toggle',p.shuffle?'zs-accent':'')}${ib('skip-back','Previous track','previous')}${ib(p.playing?'pause':'play',p.playing?'Pause':'Play','toggle','zs-playbig')}${ib('skip-forward','Next track','skip')}${ib('repeat','Toggle repeat','repeat',p.repeat?'zs-accent':'')}</div><div class="zs-playerfoot"><button data-action="device">${icon('volume-2','◖')} This phone</button><button class="zs-accent" data-action="queue">${icon('list-music','☷')} Queue (${p.queue.length})</button></div>`}
const phones=new Map();
function content(p){switch(p.view){case 'library':return library(p.variant);case 'search':return search();case 'album':return album(p);case 'queue':return queue(p);case 'playlist':return playlist(p);case 'player':return player(p);case 'songs':return songs(p.variant);case 'albums':return `<div class="zs-top"><button class="zs-accent" data-action="library">‹ Library</button></div><h1 class="zs-title">Albums</h1>${albumGrid(5)}`;case 'artists':return `<div class="zs-top"><button class="zs-accent" data-action="library">‹ Library</button></div><h1 class="zs-title">Artists</h1>${albums.slice(0,4).map((a,i)=>row({title:a.artist,artist:i===0?'2 albums':'1 album',art:a.art},i)).join('')}`;case 'artist':return `<div class="zs-top"><button class="zs-accent" data-action="artists">‹ Artists</button></div><h1 class="zs-title">Mira Sol</h1><p class="zs-subtitle">2 albums in your library</p>${actions()}${heading('Albums')}${albumGrid(2)}${heading('Songs')}${tracks.slice(0,2).map((t,i)=>row(t,i)).join('')}`;case 'playlists':return `<div class="zs-top"><button class="zs-accent" data-action="library">‹ Library</button></div><h1 class="zs-title">Playlists</h1>${feature()}${row({title:'Slow mornings',artist:'18 songs',art:'blue'},1)}${row({title:'On repeat',artist:'32 songs',art:'motion'},2)}`;default:return library(p.variant)}}
function bottom(p){let t=tracks[p.current||0];return `<div class="zs-bottom">${p.view==='player'?'':`<div class="zs-mini"><img src="${ART[t.art]}" alt=""><button class="zs-minititle" data-action="player">${t.title}<small>${t.artist}</small></button>${ib(p.playing?'pause':'play',p.playing?'Pause':'Play','toggle')}${ib('skip-forward','Next song','skip')}${ib('list-music','Open queue','queue')}</div>`}<nav class="zs-nav" aria-label="Main navigation">${[['library','library','Library','▥'],['playlists','list-music','Playlists','☷'],['search','search','Search','⌕']].map(([a,i,l,f])=>`<button class="${p.view===a?'zs-accent':''}" data-action="${a}">${icon(i,f)}${l}</button>`).join('')}</nav><div class="zs-home"></div></div>`}
function redraw(p){p.el.querySelector('.zs-content').innerHTML=content(p);p.el.querySelector('.zs-bottom')?.remove();p.el.insertAdjacentHTML('beforeend',bottom(p));refreshIcons()}
function refreshIcons(){if(globalThis.lucide)lucide.createIcons()}
const root=document.getElementById('zs-carousel');
variants.forEach((v,vi)=>{let s=document.createElement('section');s.dataset.variant=v.name;s.className='zs-stage';s.hidden=vi!==0;s.innerHTML=`<div class="zs-direction"><div><h2>${v.name}</h2><p>${v.desc}</p></div><div class="zs-platform" aria-label="Platform"><button data-platform="ios" aria-pressed="true">iPhone</button><button data-platform="android" aria-pressed="false">Android</button></div></div><div class="zs-pair"></div><p class="zs-footer">${v.note}</p>`;root.appendChild(s);[0,1].forEach(i=>{let spec=document.createElement('div');spec.className='zs-specimen';spec.innerHTML=`<p class="zs-caption">${v.labels[i]}</p><div class="zs-phone ${v.dark?'dark':''} ${v.layout==='compact'?'zs-compact':''}" aria-label="${v.name} ${i===0?'library':'detail'} mockup"><div class="zs-status"><span>9:41</span><span class="zs-island"></span><span class="zs-system">▮▮▮ ◒ ▰</span></div><div class="zs-content"></div></div>`;s.querySelector('.zs-pair').appendChild(spec);let el=spec.querySelector('.zs-phone');let p={el,variant:v,view:i===0?'library':v.focus,queue:tracks.slice(1,6),playlist:tracks.slice(0,6),current:0,playing:true,edit:true,shuffle:false};phones.set(el,p);redraw(p);if(globalThis.Tweak){let state={accent:v.accent,dark:v.dark};let tw=new Tweak({container:el,onChange:()=>{el.style.setProperty('--zs-accent',state.accent);el.classList.toggle('dark',state.dark)}});tw.addColorPicker(state,'accent',{label:'Accent'});tw.addToggle(state,'dark',{label:'Dark appearance'})}});s.querySelectorAll('[data-platform]').forEach(b=>b.addEventListener('click',()=>{s.querySelectorAll('[data-platform]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));s.querySelectorAll('.zs-phone').forEach(x=>x.classList.toggle('android',b.dataset.platform==='android'))}))});
function toast(p,text){p.el.querySelector('.zs-toast')?.remove();let el=document.createElement('div');el.className='zs-toast';el.setAttribute('role','status');el.textContent=text;p.el.appendChild(el);setTimeout(()=>el.remove(),2400)}
function menu(p,index=0,albumMode=false){p.menuIndex=index;let scrim=document.createElement('div');scrim.className='zs-scrim';scrim.innerHTML=`<div class="zs-sheet"><div class="zs-sheetheader"><strong>${albumMode?'Tides':tracks[index].title}</strong><button class="zs-iconbtn" data-action="close-menu" aria-label="Close actions">×</button></div><button class="zs-menuitem" data-action="next">Play next ${icon('list-start','☷')}</button><button class="zs-menuitem" data-action="last">Play last ${icon('list-end','☷')}</button><button class="zs-menuitem" data-action="add-playlist">Add to playlist ${icon('list-plus','+')}</button></div>`;p.el.appendChild(scrim);scrim.addEventListener('click',e=>{if(e.target===scrim)scrim.remove()});refreshIcons()}
root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let el=b.closest('.zs-phone'),p=phones.get(el);if(!p)return;let a=b.dataset.action;let i=Number(b.dataset.index||b.closest('[data-track]')?.dataset.track||0);const views=['library','search','album','queue','playlist','player','songs','albums','artists','artist','playlists'];if(views.includes(a)){p.view=a;if(a==='album')p.album=i;redraw(p);return}if(a==='track'){if(p.view==='artists'){p.view='artist';redraw(p);return}if(p.view==='playlists'||p.view==='library'&&p.variant.layout==='collections'){p.view='playlist';redraw(p);return}p.current=i;p.playing=true;redraw(p);return}if(a==='track-menu'||a==='album-menu'){menu(p,i,a==='album-menu');return}if(a==='close-menu'){p.el.querySelector('.zs-scrim')?.remove();return}if(a==='next'||a==='last'){let t=tracks[p.menuIndex??1];if(a==='next')p.queue.unshift(t);else p.queue.push(t);p.el.querySelector('.zs-scrim')?.remove();if(p.view==='queue')redraw(p);toast(p,`${t.title} · ${a==='next'?'Playing next':'Added to end of queue'}`);return}if(a==='move-up'||a==='move-down'){let list=p.view==='playlist'?p.playlist:p.queue;let j=i+(a==='move-up'?-1:1);if(j>=0&&j<list.length)[list[i],list[j]]=[list[j],list[i]];redraw(p);return}if(a==='toggle'){p.playing=!p.playing;redraw(p);return}if(a==='skip'||a==='previous'){p.current=(p.current+(a==='skip'?1:tracks.length-1))%tracks.length;redraw(p);return}if(a==='shuffle'||a==='play-all'){p.playing=true;p.shuffle=a==='shuffle';if(p.shuffle)p.current=3;redraw(p);toast(p,p.shuffle?'Shuffling this collection':'Playing in order');return}if(a==='shuffle-toggle'||a==='repeat'){p[a==='repeat'?'repeat':'shuffle']=!p[a==='repeat'?'repeat':'shuffle'];redraw(p);return}if(a==='shuffle-queue'){p.queue.reverse();redraw(p);return}if(a==='clear-queue'){p.queue=[];redraw(p);return}if(a==='toggle-edit'){p.edit=!p.edit;redraw(p);return}if(a==='search-filter'){let filter=b.dataset.filter;p.el.querySelectorAll('[data-search-group]').forEach(g=>g.hidden=filter!=='all'&&g.dataset.searchGroup!==filter);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));return}if(a==='sort'){let scrim=document.createElement('div');scrim.className='zs-scrim';scrim.innerHTML=`<div class="zs-sheet"><div class="zs-sheetheader"><strong>Sort by</strong><button data-action="close-menu">Done</button></div>${['Title','Artist','Recently added'].map(t=>`<button class="zs-menuitem" data-action="sort-choice">${t}</button>`).join('')}</div>`;el.appendChild(scrim);return}if(a==='sort-choice'){el.querySelector('.zs-scrim')?.remove();toast(p,`Sort by ${b.textContent}`);return}if(a==='provider-add'){toast(p,'Added to library · demo only');b.disabled=true;b.innerHTML='✓';return}if(a==='add-playlist'){p.el.querySelector('.zs-scrim')?.remove();p.playlist.push(tracks[p.menuIndex||0]);toast(p,'Added to Evening drive');return}if(a==='search-cycle'){toast(p,'Example search: Mira Sol · library and provider matches');return}toast(p,{'settings':'Connected to your Navidrome library','device':'Playing on this phone','create':'Playlist creation would open here'}[a]||'Preview action')});
let swipeStart=null;
root.addEventListener('pointerdown',e=>{let row=e.target.closest('.zs-row[data-track]');if(row&&!row.draggable)swipeStart={x:e.clientX,y:e.clientY,row};else swipeStart=null});
root.addEventListener('pointerup',e=>{if(!swipeStart)return;const {x,y,row}=swipeStart;swipeStart=null;if(Math.abs(e.clientX-x)<45||Math.abs(e.clientY-y)>30)return;let p=phones.get(row.closest('.zs-phone'));p.menuIndex=Number(row.dataset.track);let t=tracks[p.menuIndex];row.outerHTML=`<div class="zs-swiped"><div class="zs-rowmain"><strong>${t.title}</strong><small>${t.artist}</small></div><button class="zs-swipeaction" data-action="next">${icon('list-start','≡')}Play next</button><button class="zs-swipeaction" data-action="last">${icon('list-end','≡')}Play last</button></div>`;refreshIcons()});
let dragIndex=null;root.addEventListener('dragstart',e=>{let row=e.target.closest('[draggable]');if(row){dragIndex=Number(row.dataset.track);e.dataTransfer.effectAllowed='move'}});root.addEventListener('dragover',e=>{if(e.target.closest('[draggable]'))e.preventDefault()});root.addEventListener('drop',e=>{let row=e.target.closest('[draggable]');if(!row||dragIndex===null)return;e.preventDefault();let p=phones.get(row.closest('.zs-phone')),list=p.view==='playlist'?p.playlist:p.queue;let t=list.splice(dragIndex,1)[0];list.splice(Number(row.dataset.track),0,t);dragIndex=null;redraw(p)});
// Standalone file fallback. The conversation host supplies the carousel controls itself.
if(!globalThis.openai){let style=document.createElement('style');style.textContent='.zs-standalone{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:14px 0;background:light-dark(#fff,#1a1a1d);color:light-dark(#222,#eee);font-family:system-ui}.zs-standalone button{font:inherit;padding:8px 12px;border:1px solid #9997;border-radius:8px;background:transparent;color:inherit}.zs-standalone button[aria-pressed=true]{background:#e83b57;color:#fff;border-color:#e83b57}';document.head.appendChild(style);let nav=document.createElement('nav');nav.className='zs-standalone';nav.setAttribute('aria-label','Choose design direction');variants.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.name;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{root.querySelectorAll(':scope > section').forEach(x=>x.hidden=x.dataset.variant!==v.name);nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};nav.appendChild(b)});document.body.appendChild(nav)}
</script></body></html>
